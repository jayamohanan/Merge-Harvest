# Publish the BUILD to GitHub Pages, not the project folder.
#
# build/ is git-ignored on purpose — it is generated, not source — so it never
# reaches GitHub. Instead GitHub runs build.sh itself on every push to dev (the
# branch tested live) and publishes what that produces. Needs Settings → Pages → Source set to
# "GitHub Actions" (once).
name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
